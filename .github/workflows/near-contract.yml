name: OUTCOME verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run full test suite
        run: PYTHONPATH=. pytest -q

  near-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build NEAR audit contract
        working-directory: near/contract
        run: cargo build --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install testnet runner dependencies
        run: npm install --prefix near --no-audit --no-fund
      - name: Check testnet runner JavaScript syntax
        run: node --check near/scripts/testnet_demo.cjs
      - name: Check restricted-key API surface
        run: node -e "const n=require('./near/node_modules/near-api-js'); if (!n.Account || !n.Account.prototype.addKey || !n.Account.prototype.functionCall) process.exit(1); console.log('near-api-js account key and function-call methods are available')"
