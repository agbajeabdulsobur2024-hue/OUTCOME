name: NEAR contract checks

on:
  push:
    paths:
      - "near/**"
      - ".github/workflows/near-contract.yml"
  pull_request:
    paths:
      - "near/**"
      - ".github/workflows/near-contract.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build NEAR audit contract
        working-directory: near/contract
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Check testnet runner JavaScript syntax
        run: node --check near/scripts/testnet_demo.cjs
